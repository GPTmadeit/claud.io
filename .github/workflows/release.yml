name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json is $v but tag is ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "CLAUDIO_VERSION = '$v'" app/index.html || { echo "app/index.html version not synced (npm run version:sync)"; exit 1; }

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      - name: Build only (manual run, no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win

      - name: Keep build output
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: claud-io-windows
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 7

      - name: Checksums and release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
          notes="../release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then gh release edit "$GITHUB_REF_NAME" --title "Claud.io ${GITHUB_REF_NAME#v}" --notes-file "$notes"; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
